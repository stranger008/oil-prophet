name: 更新油价

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓油价更新页面
        run: python update.py
      - name: 提交更新
        run: |
          git config --global user.name "oil-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "auto update: $(date -u '+%Y-%m-%d')"
          git push
